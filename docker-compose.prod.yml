
services:
  db:
    image: postgis/postgis:16-3.5
    container_name: bogota_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bogota_map
      POSTGRES_USER: bogota_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bogota_user -d bogota_map"]
      interval: 5s
      timeout: 5s
      retries: 20

  loader:
    image: iboates/osm2pgsql:latest
    container_name: bogota_loader
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data:/data:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /data/bogota.osm.pbf ]; then
          echo "[loader] No se encontró /data/bogota.osm.pbf"
          exit 1
        fi
        osm2pgsql --host db --port 5432 --username bogota_user --database bogota_map --slim --hstore --number-processes 4 /data/bogota.osm.pbf
        echo "[loader] Carga OSM completa."

  vistas:
    image: postgis/postgis:16-3.5
    container_name: bogota_vistas
    restart: "no"
    depends_on:
      loader:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -h db -U bogota_user -d bogota_map -v ON_ERROR_STOP=1 -f /sql/02_crear_vistas.sql
        echo "[vistas] Vistas creadas en schema tiles."

  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: bogota_osrm_car
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ./data/osrm:/data:ro
    command: >
      sh -c "
        if [ ! -f /data/bogota.osrm ]; then
          echo '[osrm-car] bogota.osrm no encontrado';
          sleep infinity;
        fi;
        osrm-routed --algorithm mld --port 5000 /data/bogota.osrm
      "

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: bogota_osrm_foot
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ./data/osrm-foot:/data:ro
    command: >
      sh -c "
        if [ ! -f /data/bogota.osrm ]; then
          echo '[osrm-foot] bogota.osrm no encontrado';
          sleep infinity;
        fi;
        osrm-routed --algorithm mld --port 5000 /data/bogota.osrm
      "

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: bogota_martin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      vistas:
        condition: service_completed_successfully
    expose:
      - "3000"
    volumes:
      - ./martin/config.yaml:/config.yaml:ro
    environment:
      MARTIN_CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
    command: ["--config", "/config.yaml"]

  app:
    build: .
    container_name: bogota_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      vistas:
        condition: service_completed_successfully
      martin:
        condition: service_started
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://bogota_user:${POSTGRES_PASSWORD}@db:5432/bogota_map
      MARTIN_PUBLIC: ${MARTIN_PUBLIC}
      OSRM_CAR_URL: ${OSRM_CAR_URL}
      OSRM_FOOT_URL: ${OSRM_FOOT_URL}
    expose:
      - "8000"

volumes:
  pgdata:

