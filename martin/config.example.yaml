postgres:
  - connection_string: ${MARTIN_DATABASE_URL}
    pool_size: 10
    auto_publish: true
    tables:
      bogota_calles:
        schema: public
        table: bogota_calles
        srid: 3857
        geometry_column: geom
        geometry_type: LINESTRING
        minzoom: 10
        maxzoom: 16
        buffer: 64
        clip_geom: false
        properties:
          osm_id: int8
          highway: text
          name: text

      bogota_edificios:
        schema: public
        table: bogota_edificios
        srid: 3857
        geometry_column: geom
        geometry_type: POLYGON
        minzoom: 14
        maxzoom: 16
        buffer: 64
        clip_geom: false
        properties:
          osm_id: int8
          name: text

      bogota_landuse:
        schema: public
        table: bogota_landuse
        srid: 3857
        geometry_column: geom
        geometry_type: GEOMETRY
        minzoom: 10
        maxzoom: 16
        buffer: 64
        clip_geom: false
        properties:
          osm_id: int8
          landuse: text
          name: text

      bogota_leisure:
        schema: public
        table: bogota_leisure
        srid: 3857
        geometry_column: geom
        geometry_type: GEOMETRY
        minzoom: 11
        maxzoom: 16
        buffer: 64
        clip_geom: false
        properties:
          osm_id: int8
          leisure: text
          name: text

      bogota_equipamiento:
        schema: public
        table: bogota_equipamiento
        srid: 3857
        geometry_column: geom
        geometry_type: GEOMETRY
        minzoom: 12
        maxzoom: 16
        buffer: 64
        clip_geom: false
        properties:
          osm_id: int8
          amenity: text
          name: text

      bogota_comercio:
        schema: public
        table: bogota_comercio
        srid: 3857
        geometry_column: geom
        geometry_type: GEOMETRY
        minzoom: 12
        maxzoom: 16
        buffer: 64
        clip_geom: false
        properties:
          osm_id: int8
          shop: text
          name: text

      bogota_ciclovias:
        schema: public
        table: bogota_ciclovias
        srid: 3857
        geometry_column: geom
        geometry_type: LINESTRING
        minzoom: 12
        maxzoom: 16
        buffer: 64
        clip_geom: false
        properties:
          osm_id: int8
          name: text

      bogota_peatonal:
        schema: public
        table: bogota_peatonal
        srid: 3857
        geometry_column: geom
        geometry_type: LINESTRING
        minzoom: 14
        maxzoom: 16
        buffer: 64
        clip_geom: false
        properties:
          osm_id: int8
          highway: text
          name: text

      bogota_agua:
        schema: public
        table: bogota_agua
        srid: 3857
        geometry_column: geom
        geometry_type: GEOMETRY
        minzoom: 10
        maxzoom: 16
        buffer: 64
        clip_geom: false
        properties:
          osm_id: int8
          waterway: text
          name: text

listen_addresses: "0.0.0.0:3000"
